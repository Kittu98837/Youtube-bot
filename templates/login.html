<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    body { font-family: sans-serif; background:#f4f4f7; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .box { background:white; padding:24px; border-radius:12px; width:280px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    input { width:100%; padding:10px; margin-top:8px; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; }
    button { width:100%; padding:10px; margin-top:12px; border:none; border-radius:8px; background:#2b2d84; color:white; font-size:15px; }
    .error { color:#a32d2d; font-size:13px; margin-top:8px; }
    h2 { margin-top:0; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Comment Bot Dashboard</h2>
    <form method="post">
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
